<div class="gallery-grid">
  {% for item in site.data.gallery %}
    <a
      href="{{ item.image | relative_url }}"
      class="gallery-item popup img-link"
    >
      <img
        src="{{ item.image | relative_url }}"
        alt="{{ item.title | escape }}"
        loading="lazy"
      >
    </a>
  {% endfor %}
</div>
